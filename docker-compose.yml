services:
  borg-email-reports:
    build:
      context: .
      target: production
    image: ghcr.io/sorge13248/borg-email-reports
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./config.json:/app/config/config.json:ro
      # Add your Borg repo mounts here (one per line):
      # - /host/path/repo-name:/home/app/repo-name:ro
