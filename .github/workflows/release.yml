name: Release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Tipo di incremento versione'
        required: true
        type: choice
        default: 'patch'
        options:
          - patch
          - minor
          - major
          - custom
      custom_version:
        description: 'Versione custom (obbligatoria solo se hai scelto "custom", es. 1.2.3)'
        required: false
        default: ''
        type: string
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: write
  packages: write
  actions: write
  pull-requests: write

jobs:
  prepare-release:
    name: Prepare Release & Create Merge Request
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Verifica autorizzazione utente
        env:
          ACTOR: ${{ github.actor }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          echo "Workflow avviato da: $ACTOR"
          echo "Owner del repository: $REPO_OWNER"
          if [ "$ACTOR" != "$REPO_OWNER" ] && [ "$ACTOR" != "sorge13248" ]; then
            echo "::error::Accesso negato. Solo l'owner del repository ($REPO_OWNER) è autorizzato a lanciare il rilascio."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - name: Configura Git e rileva branch
        id: git_setup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin develop; then
            echo "Branch develop trovato su origin. Base di partenza: develop."
            git checkout -B develop origin/develop
            echo "has_develop=true" >> $GITHUB_OUTPUT
          else
            echo "Branch develop non trovato su origin. Base di partenza: main."
            git checkout -B main origin/main
            echo "has_develop=false" >> $GITHUB_OUTPUT
          fi

      - name: Calcola nuova versione e aggiorna package.json
        id: versioning
        run: |
          python3 - << 'EOF'
          import json
          import os
          import sys

          bump_type = """${{ github.event.inputs.bump_type }}""".strip()
          custom_ver = """${{ github.event.inputs.custom_version }}""".strip().lstrip("v")

          with open("package.json", "r", encoding="utf-8") as f:
              root_pkg = json.load(f)
          current_ver = root_pkg.get("version", "0.0.0")

          if bump_type == "custom":
              if not custom_ver:
                  print("::error::Hai selezionato 'custom' ma non hai specificato custom_version!")
                  sys.exit(1)
              new_ver = custom_ver
          else:
              try:
                  parts = list(map(int, current_ver.split(".")))
                  if len(parts) != 3:
                      raise ValueError("Formato semver deve essere X.Y.Z")
              except Exception as e:
                  print(f"::error::Impossibile analizzare la versione attuale '{current_ver}': {e}")
                  sys.exit(1)

              if bump_type == "major":
                  parts[0] += 1
                  parts[1] = 0
                  parts[2] = 0
              elif bump_type == "minor":
                  parts[1] += 1
                  parts[2] = 0
              elif bump_type == "patch":
                  parts[2] += 1
              else:
                  print(f"::error::Tipo di incremento sconosciuto: {bump_type}")
                  sys.exit(1)

              new_ver = ".".join(map(str, parts))

          print(f"Versione precedente: {current_ver}")
          print(f"Tipo di incremento: {bump_type}")
          print(f"Nuova versione: {new_ver}")

          files_to_update = [
              "package.json",
              "package-lock.json",
          ]

          for file_path in files_to_update:
              if not os.path.exists(file_path):
                  continue
              with open(file_path, "r", encoding="utf-8") as f:
                  data = json.load(f)
              data["version"] = new_ver
              if "packages" in data and "" in data["packages"]:
                  data["packages"][""]["version"] = new_ver
              with open(file_path, "w", encoding="utf-8") as f:
                  json.dump(data, f, indent=2)
                  f.write("\n")
              print(f"Aggiornato: {file_path} -> {new_ver}")

          github_output = os.getenv("GITHUB_OUTPUT")
          if github_output:
              with open(github_output, "a", encoding="utf-8") as f:
                  f.write(f"previous_version={current_ver}\n")
                  f.write(f"new_version={new_ver}\n")
                  f.write(f"tag_name=v{new_ver}\n")
          EOF

      - name: Commit e push su branch di lavoro
        id: commit_push
        run: |
          NEW_VER="${{ steps.versioning.outputs.new_version }}"
          HAS_DEVELOP="${{ steps.git_setup.outputs.has_develop }}"
          
          if [ "$HAS_DEVELOP" = "true" ]; then
            HEAD_BRANCH="develop"
            git add package.json package-lock.json
            if git diff --staged --quiet; then
              echo "Nessuna modifica da committare su develop."
            else
              git commit -m "chore(release): bump version to v${NEW_VER}"
              git push origin develop
            fi
          else
            HEAD_BRANCH="release/v${NEW_VER}"
            git checkout -b "${HEAD_BRANCH}"
            git add package.json package-lock.json
            if git diff --staged --quiet; then
              echo "Nessuna modifica da committare su ${HEAD_BRANCH}."
            else
              git commit -m "chore(release): bump version to v${NEW_VER}"
              git push -u origin "${HEAD_BRANCH}"
            fi
          fi

          echo "head_branch=${HEAD_BRANCH}" >> $GITHUB_OUTPUT

      - name: Genera note di rilascio
        id: release_notes
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          PREV_TAG: "v${{ steps.versioning.outputs.previous_version }}"
          TAG_NAME: "${{ steps.versioning.outputs.tag_name }}"
          REPO: "${{ github.repository }}"
        run: |
          echo "Generazione note di rilascio da ${PREV_TAG} a ${TAG_NAME}..."
          
          python3 - << 'EOF'
          import json
          import os
          import re
          import subprocess
          import urllib.request

          prev_tag = os.getenv("PREV_TAG", "").strip()
          tag_name = os.getenv("TAG_NAME", "").strip()
          repo = os.getenv("REPO", "").strip()
          token = os.getenv("GH_TOKEN", "").strip()

          if prev_tag and subprocess.run(["git", "rev-parse", "-q", "--verify", f"refs/tags/{prev_tag}"], capture_output=True).returncode == 0:
              commit_range = f"{prev_tag}..HEAD"
              changelog_link = f"https://github.com/{repo}/compare/{prev_tag}...{tag_name}"
          else:
              commit_range = "HEAD"
              changelog_link = f"https://github.com/{repo}/commits/{tag_name}"

          cmd = [
              "git", "log", commit_range, "--no-merges",
              "--invert-grep", "--grep=^chore(release)",
              "--pretty=format:%H\x1f%h\x1f%ae\x1f%an\x1f%s"
          ]
          res = subprocess.run(cmd, capture_output=True, text=True)
          raw_commits = res.stdout.strip().split("\n") if res.stdout.strip() else []

          author_map = {}
          if token and repo:
              try:
                  api_url = f"https://api.github.com/repos/{repo}/compare/{prev_tag}...HEAD" if (prev_tag and commit_range != "HEAD") else f"https://api.github.com/repos/{repo}/commits?sha=HEAD"
                  req = urllib.request.Request(api_url, headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "release-workflow"
                  })
                  with urllib.request.urlopen(req, timeout=10) as response:
                      data = json.load(response)
                      items = data.get("commits", []) if isinstance(data, dict) else data
                      for item in items:
                          sha = item.get("sha")
                          author = item.get("author")
                          if sha and author and author.get("login"):
                              author_map[sha] = author["login"]
              except Exception as e:
                  print(f"::warning::GitHub API user mapping failed: {e}")

          lines = []
          for line in raw_commits:
              if not line:
                  continue
              parts = line.split("\x1f")
              if len(parts) < 5:
                  continue
              full_sha, short_sha, email, name, subject = parts[0], parts[1], parts[2], parts[3], parts[4]

              gh_user = author_map.get(full_sha)
              if not gh_user:
                  m = re.match(r"^(?:[0-9]+\+)?([^@]+)@users\.noreply\.github\.com$", email)
                  if m:
                      gh_user = m.group(1)

              if gh_user:
                  author_str = f"by @{gh_user}"
              else:
                  author_str = f"by {name}"

              commit_url = f"https://github.com/{repo}/commit/{full_sha}"
              lines.append(f"* {subject} {author_str} in [{short_sha}]({commit_url})")

          with open("release_notes.md", "w", encoding="utf-8") as f:
              f.write("## What's Changed\n")
              if lines:
                  f.write("\n".join(lines) + "\n\n")
              else:
                  f.write("* Nessuna modifica rilevante o solo aggiornamenti di manutenzione.\n\n")
              f.write(f"**Full Changelog**: {changelog_link}\n")

          print(f"Generate note di rilascio con {len(lines)} commit.")
          EOF

      - name: Crea Merge Request (Pull Request) verso main
        id: create_pr
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ steps.commit_push.outputs.head_branch }}
          NEW_VER: ${{ steps.versioning.outputs.new_version }}
        run: |
          echo "Verifica presenza di una Pull Request aperta da ${HEAD_BRANCH} verso main..."
          EXISTING_PR=$(gh pr list --base main --head "${HEAD_BRANCH}" --state open --json number --jq '.[0].number')
          
          if [ -n "$EXISTING_PR" ]; then
            echo "Aggiornamento Pull Request esistente #${EXISTING_PR}..."
            gh pr edit "$EXISTING_PR" \
              --title "chore(release): bump version to v${NEW_VER}" \
              --body-file release_notes.md
            PR_URL=$(gh pr view "$EXISTING_PR" --json url --jq '.url')
          else
            echo "Creazione nuova Pull Request verso main..."
            PR_URL=$(gh pr create \
              --base main \
              --head "${HEAD_BRANCH}" \
              --title "chore(release): bump version to v${NEW_VER}" \
              --body-file release_notes.md)
          fi

          echo "pr_url=${PR_URL}" >> $GITHUB_OUTPUT
          echo "Pull Request pronta: ${PR_URL}"

      - name: Summary del rilascio
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ## 🔀 Merge Request di rilascio creata con successo!
          
          * **Versione precedente:** `${{ steps.versioning.outputs.previous_version }}`
          * **Nuova versione proposta:** `${{ steps.versioning.outputs.new_version }}`
          * **Branch sorgente:** `${{ steps.commit_push.outputs.head_branch }}`
          * **Branch destinazione:** `main`
          * **Merge Request (PR):** [Apri la Pull Request](${{ steps.create_pr.outputs.pr_url }})
          
          > ℹ️ Una volta revisionata e completata la merge su `main`, la pipeline di pubblicazione completerà automaticamente il rilascio (creazione del tag Git, GitHub Release e build Docker multi-arch su GHCR).
          EOF

  publish-release:
    name: Publish Release & Trigger Build
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true && startsWith(github.event.pull_request.title, 'chore(release):')
    permissions:
      contents: write
      packages: write
      actions: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - name: Configura Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Estrai versione
        id: release_info
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG_NAME="v${VERSION}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "Versione target: ${VERSION} (${TAG_NAME})"

      - name: Crea Git Tag e GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.release_info.outputs.tag_name }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf "%s\n" "$PR_BODY" > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "Release ${TAG_NAME}" > release_notes.md
          fi

          if git rev-parse -q --verify "refs/tags/${TAG_NAME}" >/dev/null; then
            echo "Il tag ${TAG_NAME} esiste già localmente/remotamente."
          else
            echo "Creazione tag ${TAG_NAME} su main..."
            git tag -a "${TAG_NAME}" -m "Release ${TAG_NAME}"
            git push origin "${TAG_NAME}"
          fi

          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            echo "La release ${TAG_NAME} esiste già su GitHub."
          else
            echo "Creazione GitHub Release per ${TAG_NAME}..."
            gh release create "${TAG_NAME}" \
              --target main \
              --title "${TAG_NAME}" \
              --notes-file release_notes.md
          fi

      - name: Avvia pipeline di publish (docker-multiarch)
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.release_info.outputs.tag_name }}
        run: |
          echo "Avvio della pipeline di publish Docker per il tag ${TAG_NAME}..."
          
          if [ -n "${{ secrets.RELEASE_PAT }}" ]; then
            echo "Tag creato con RELEASE_PAT. docker-multiarch si avvierà automaticamente."
          else
            echo "Avvio esplicito di docker-multiarch via workflow_dispatch..."
            gh workflow run docker-multiarch.yml --ref "${TAG_NAME}"
          fi

      - name: Summary del rilascio pubblicato
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ## 🚀 Rilascio pubblicato con successo!
          
          * **Versione pubblicata:** `${{ steps.release_info.outputs.version }}`
          * **Tag creato:** `${{ steps.release_info.outputs.tag_name }}`
          * **Branch:** `main`
          * **Merge Request originaria:** #${{ github.event.pull_request.number }}
          * **Pipeline di publish:** Avviata per la build Docker multi-arch (amd64 / arm64) su GHCR
          EOF
